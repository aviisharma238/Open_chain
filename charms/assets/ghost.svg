<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125" width="100%" height="100%">
  <defs>
    <radialGradient id="ghost-grad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </radialGradient>
    <linearGradient id="ghost-ring-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="candy-gold" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <filter id="ghost-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Top Hanging Charm Ring -->
  <g class="oc-charm-loop">
    <circle cx="50" cy="8" r="6" fill="none" stroke="url(#ghost-ring-silver)" stroke-width="2.5" filter="url(#ghost-glow)"/>
    <circle cx="50" cy="8" r="4.2" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.8"/>
    <rect x="47" y="13" width="6" height="4" rx="1.5" fill="url(#ghost-ring-silver)"/>
  </g>

  <!-- Ghost Body with Rippling Wavy Skirt -->
  <path d="M 50 18 
           C 28 18, 20 38, 20 62 
           C 20 78, 16 96, 22 101 
           C 25 104, 28 97, 32 97 
           C 36 97, 39 104, 44 102 
           C 48 100, 48 96, 52 96 
           C 56 96, 58 103, 62 101 
           C 66 99, 68 96, 72 96 
           C 76 96, 80 104, 83 100 
           C 87 95, 80 78, 80 62 
           C 80 38, 72 18, 50 18 Z" 
        fill="url(#ghost-grad)" 
        stroke="#DDD6FE" 
        stroke-width="1.2" 
        filter="url(#ghost-glow)"/>

  <!-- Left Floating Arm -->
  <path d="M 24 58 C 16 57, 12 65, 17 68 C 21 70, 26 65, 27 61 Z" fill="url(#ghost-grad)" filter="url(#ghost-glow)"/>

  <!-- Right Floating Arm -->
  <path d="M 76 58 C 84 57, 88 65, 83 68 C 79 70, 74 65, 73 61 Z" fill="url(#ghost-grad)" filter="url(#ghost-glow)"/>

  <!-- Cheeks Heart Blush -->
  <ellipse cx="32" cy="54" rx="4.5" ry="3" fill="#F472B6" opacity="0.45"/>
  <ellipse cx="68" cy="54" rx="4.5" ry="3.5" fill="#F472B6" opacity="0.45"/>

  <!-- Expressive Cute Eyes -->
  <g class="oc-ghost-eyes">
    <ellipse cx="39" cy="48" rx="3.5" ry="4.5" fill="#312E81"/>
    <circle cx="37.5" cy="46" r="1.5" fill="#FFFFFF"/>

    <ellipse cx="61" cy="48" rx="3.5" ry="4.5" fill="#312E81"/>
    <circle cx="59.5" cy="46" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Friendly "O" Open Happy Mouth -->
  <ellipse cx="50" cy="56" rx="2.8" ry="3.8" fill="#4338CA"/>
  <ellipse cx="50" cy="57" rx="1.6" ry="2" fill="#F43F5E"/>

  <!-- Glowing Mini Star Lantern / Candy in hands -->
  <g filter="url(#ghost-glow)">
    <polygon points="50,69 53,75 60,76 55,81 57,87 50,83 43,87 45,81 40,76 47,75" fill="url(#candy-gold)"/>
    <circle cx="50" cy="79" r="2" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Little hands holding the star -->
  <circle cx="44" cy="78" r="3.2" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="0.8"/>
  <circle cx="56" cy="78" r="3.2" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="0.8"/>
</svg>
