<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125" width="100%" height="100%">
  <defs>
    <radialGradient id="plane-body-grad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <linearGradient id="plane-belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="prop-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="plane-ring-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="plane-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#0369A1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Top Hanging Charm Ring -->
  <g class="oc-charm-loop">
    <circle cx="50" cy="8" r="6" fill="none" stroke="url(#plane-ring-metal)" stroke-width="2.5" filter="url(#plane-shadow)"/>
    <circle cx="50" cy="8" r="4.2" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.8"/>
    <rect x="47" y="13" width="6" height="4" rx="1.5" fill="url(#plane-ring-metal)"/>
  </g>

  <!-- Rear Tail Wing & Fin -->
  <g filter="url(#plane-shadow)">
    <!-- Vertical Rudder / Tail Fin -->
    <path d="M 46 20 C 46 16, 50 14, 54 14 C 55 18, 55 26, 50 28 Z" fill="#0284C7"/>
    <path d="M 47 19 L 52 15 L 53 23 Z" fill="#F43F5E" opacity="0.9"/>
    <!-- Horizontal Stabilizers -->
    <ellipse cx="50" cy="28" rx="18" ry="4" fill="#0284C7"/>
  </g>

  <!-- Main Left Wing -->
  <g filter="url(#plane-shadow)">
    <path d="M 48 54 C 28 50, 10 52, 6 56 C 4 60, 16 66, 45 62 Z" fill="url(#plane-body-grad)"/>
    <!-- Wing Star Decal -->
    <circle cx="16" cy="58" r="3.5" fill="#FFFFFF"/>
    <circle cx="16" cy="58" r="2" fill="#F43F5E"/>
  </g>

  <!-- Main Right Wing -->
  <g filter="url(#plane-shadow)">
    <path d="M 52 54 C 72 50, 90 52, 94 56 C 96 60, 84 66, 55 62 Z" fill="url(#plane-body-grad)"/>
    <!-- Wing Star Decal -->
    <circle cx="84" cy="58" r="3.5" fill="#FFFFFF"/>
    <circle cx="84" cy="58" r="2" fill="#F43F5E"/>
  </g>

  <!-- Airplane Fuselage / Body (Chubby Kawaii Plane) -->
  <ellipse cx="50" cy="56" rx="22" ry="30" fill="url(#plane-body-grad)" filter="url(#plane-shadow)"/>
  <ellipse cx="50" cy="65" rx="16" ry="18" fill="url(#plane-belly-grad)"/>

  <!-- Aviator Goggles on Cockpit Forehead -->
  <g filter="url(#plane-shadow)">
    <!-- Goggle Strap -->
    <path d="M 30 38 Q 50 35 70 38" stroke="#475569" stroke-width="2.5" fill="none"/>
    <!-- Left Goggle Lens -->
    <ellipse cx="40" cy="38" rx="7" ry="6" fill="#E0F2FE" stroke="#334155" stroke-width="1.8"/>
    <ellipse cx="38" cy="36" rx="2.2" ry="1.4" fill="#FFFFFF" opacity="0.8"/>
    <!-- Right Goggle Lens -->
    <ellipse cx="60" cy="38" rx="7" ry="6" fill="#E0F2FE" stroke="#334155" stroke-width="1.8"/>
    <ellipse cx="58" cy="36" rx="2.2" ry="1.4" fill="#FFFFFF" opacity="0.8"/>
    <!-- Bridge -->
    <line x1="47" y1="38" x2="53" y2="38" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Big Kawaii Eyes -->
  <g class="oc-plane-eyes">
    <ellipse cx="39" cy="55" rx="4" ry="5.5" fill="#0F172A"/>
    <circle cx="37.5" cy="53" r="1.8" fill="#FFFFFF"/>
    <circle cx="40.5" cy="57" r="0.9" fill="#FFFFFF"/>

    <ellipse cx="61" cy="55" rx="4" ry="5.5" fill="#0F172A"/>
    <circle cx="59.5" cy="53" r="1.8" fill="#FFFFFF"/>
    <circle cx="62.5" cy="57" r="0.9" fill="#FFFFFF"/>
  </g>

  <!-- Pink Cheek Blush -->
  <ellipse cx="31" cy="62" rx="4.5" ry="3" fill="#FB7185" opacity="0.6"/>
  <ellipse cx="69" cy="62" rx="4.5" ry="3.5" fill="#FB7185" opacity="0.6"/>

  <!-- Sweet Smiling Mouth -->
  <path d="M 46 64 Q 50 67 54 64" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Front Nose Engine & Spinning Propeller at Bottom Nose -->
  <g filter="url(#plane-shadow)">
    <!-- Nose Cap -->
    <ellipse cx="50" cy="85" rx="9" ry="5" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="50" cy="86" r="3.5" fill="url(#prop-gold)"/>

    <!-- Propeller Blades with Motion Blur -->
    <g class="oc-plane-propeller">
      <ellipse cx="37" cy="86" rx="10" ry="3.5" fill="url(#prop-gold)" opacity="0.9" transform="rotate(-10 37 86)"/>
      <ellipse cx="63" cy="86" rx="10" ry="3.5" fill="url(#prop-gold)" opacity="0.9" transform="rotate(-10 63 86)"/>
      <circle cx="50" cy="86" r="2.5" fill="#CA8A04"/>
      <circle cx="50" cy="86" r="1" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Mini Landing Gear Wheels -->
  <g filter="url(#plane-shadow)">
    <rect x="36" y="80" width="3" height="12" rx="1" fill="#475569"/>
    <ellipse cx="37.5" cy="93" rx="3.5" ry="4.5" fill="#1E293B"/>
    <circle cx="37.5" cy="93" r="1.5" fill="#94A3B8"/>

    <rect x="61" y="80" width="3" height="12" rx="1" fill="#475569"/>
    <ellipse cx="62.5" cy="93" rx="3.5" ry="4.5" fill="#1E293B"/>
    <circle cx="62.5" cy="93" r="1.5" fill="#94A3B8"/>
  </g>
</svg>
