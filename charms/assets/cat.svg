<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125" width="100%" height="100%">
  <defs>
    <radialGradient id="cat-body-grad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F6F3EE"/>
      <stop offset="100%" stop-color="#E5DEC9"/>
    </radialGradient>
    <radialGradient id="cat-ear-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB3C6"/>
      <stop offset="100%" stop-color="#FF8FA3"/>
    </radialGradient>
    <linearGradient id="bell-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="ring-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Top Hanging Charm Ring -->
  <g class="oc-charm-loop">
    <circle cx="50" cy="8" r="6" fill="none" stroke="url(#ring-metal)" stroke-width="2.5" filter="url(#soft-shadow)"/>
    <circle cx="50" cy="8" r="4.2" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.8"/>
    <rect x="47" y="13" width="6" height="4" rx="1.5" fill="url(#ring-metal)"/>
  </g>

  <!-- Tail -->
  <path d="M 68 85 C 84 85, 88 68, 83 60 C 80 55, 75 58, 77 64 C 79 70, 75 77, 66 77 Z" fill="#F6F3EE" stroke="#E5DEC9" stroke-width="1.5" filter="url(#soft-shadow)"/>
  <path d="M 81 60 C 84 62, 83 66, 80 69" stroke="#FB923C" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Left Ear -->
  <g filter="url(#soft-shadow)">
    <polygon points="25,40 33,16 48,34" fill="#F6F3EE" stroke="#E5DEC9" stroke-width="1"/>
    <!-- Calico patch on left ear -->
    <path d="M 27 38 L 33 16 L 40 25 Z" fill="#4B382A"/>
    <polygon points="29,36 34,22 43,33" fill="url(#cat-ear-grad)"/>
  </g>

  <!-- Right Ear -->
  <g filter="url(#soft-shadow)">
    <polygon points="52,34 67,16 75,40" fill="#F6F3EE" stroke="#E5DEC9" stroke-width="1"/>
    <polygon points="57,33 66,22 71,36" fill="url(#cat-ear-grad)"/>
    <!-- Ginger patch on right ear -->
    <path d="M 67 16 L 75 40 L 68 36 Z" fill="#FB923C"/>
  </g>

  <!-- Cat Body & Head Base -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="50" cy="54" rx="28" ry="26" fill="url(#cat-body-grad)"/>
    <ellipse cx="50" cy="78" rx="24" ry="20" fill="url(#cat-body-grad)"/>
  </g>

  <!-- Calico Head Spots -->
  <path d="M 62 33 C 70 34, 76 42, 75 50 C 70 48, 66 42, 62 33 Z" fill="#FB923C" opacity="0.9"/>
  <path d="M 28 44 C 26 50, 30 55, 34 54 C 34 47, 30 45, 28 44 Z" fill="#4B382A" opacity="0.85"/>

  <!-- Cheeks Blush -->
  <ellipse cx="33" cy="56" rx="5" ry="3" fill="#FF8FA3" opacity="0.6"/>
  <ellipse cx="67" cy="56" rx="5" ry="3" fill="#FF8FA3" opacity="0.6"/>

  <!-- Eyes -->
  <g class="oc-cat-eyes">
    <!-- Left Eye -->
    <circle cx="38" cy="50" r="4.2" fill="#292524"/>
    <circle cx="36.5" cy="48.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="39.8" cy="51.8" r="0.7" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <circle cx="62" cy="50" r="4.2" fill="#292524"/>
    <circle cx="60.5" cy="48.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="63.8" cy="51.8" r="0.7" fill="#FFFFFF"/>
  </g>

  <!-- Nose & Mouth -->
  <polygon points="48.5,54 51.5,54 50,56.5" fill="#FF8FA3"/>
  <path d="M 46 58 C 48 60, 50 60, 50 58 C 50 60, 52 60, 54 58" fill="none" stroke="#292524" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Whiskers -->
  <g stroke="#A8A29E" stroke-width="1" stroke-linecap="round">
    <line x1="26" y1="52" x2="16" y2="50"/>
    <line x1="25" y1="55" x2="15" y2="56"/>
    <line x1="74" y1="52" x2="84" y2="50"/>
    <line x1="75" y1="55" x2="85" y2="56"/>
  </g>

  <!-- Red Collar Ribbon -->
  <path d="M 32 68 Q 50 74 68 68 Q 50 78 32 68 Z" fill="#EF4444" filter="url(#soft-shadow)"/>

  <!-- Hanging Golden Bell -->
  <g filter="url(#soft-shadow)">
    <circle cx="50" cy="74" r="5" fill="url(#bell-gold)"/>
    <circle cx="48.5" cy="72.5" r="1.2" fill="#FFFFFF" opacity="0.7"/>
    <line x1="46" y1="74.5" x2="54" y2="74.5" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="50" cy="76" r="1" fill="#78350F"/>
  </g>

  <!-- Front Paws -->
  <g filter="url(#soft-shadow)">
    <ellipse cx="41" cy="79" rx="5" ry="4" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="0.8"/>
    <line x1="41" y1="78" x2="41" y2="82" stroke="#E5DEC9" stroke-width="0.8"/>
    <ellipse cx="59" cy="79" rx="5" ry="4" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="0.8"/>
    <line x1="59" y1="78" x2="59" y2="82" stroke="#E5DEC9" stroke-width="0.8"/>
  </g>

  <!-- Little Back Feet -->
  <ellipse cx="34" cy="94" rx="6" ry="4" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="0.8"/>
  <ellipse cx="66" cy="94" rx="6" ry="4" fill="#FFFFFF" stroke="#E5DEC9" stroke-width="0.8"/>
</svg>
