<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125" width="100%" height="100%">
  <defs>
    <radialGradient id="frog-body-grad" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="60%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </radialGradient>
    <radialGradient id="frog-belly-grad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </radialGradient>
    <linearGradient id="crown-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="frog-ring-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="frog-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Top Hanging Charm Ring -->
  <g class="oc-charm-loop">
    <circle cx="50" cy="8" r="6" fill="none" stroke="url(#frog-ring-metal)" stroke-width="2.5" filter="url(#frog-shadow)"/>
    <circle cx="50" cy="8" r="4.2" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.8"/>
    <rect x="47" y="13" width="6" height="4" rx="1.5" fill="url(#frog-ring-metal)"/>
  </g>

  <!-- Golden Mini Crown on Head -->
  <g filter="url(#frog-shadow)">
    <polygon points="43,26 44,20 47,23 50,18 53,23 56,20 57,26" fill="url(#crown-gold)"/>
    <circle cx="44" cy="19.5" r="1" fill="#FEF08A"/>
    <circle cx="50" cy="17.5" r="1.2" fill="#FEF08A"/>
    <circle cx="56" cy="19.5" r="1" fill="#FEF08A"/>
    <rect x="43" y="25" width="14" height="2" rx="0.8" fill="#B45309"/>
  </g>

  <!-- Eye Sockets (Bulges on top of head) -->
  <g filter="url(#frog-shadow)">
    <circle cx="33" cy="35" r="13" fill="url(#frog-body-grad)"/>
    <circle cx="67" cy="35" r="13" fill="url(#frog-body-grad)"/>
  </g>

  <!-- Eyeballs -->
  <circle cx="33" cy="35" r="9" fill="#FFFFFF"/>
  <circle cx="67" cy="35" r="9" fill="#FFFFFF"/>

  <!-- Pupils & Eye Catchlights -->
  <g class="oc-frog-eyes">
    <circle cx="34" cy="35" r="5" fill="#14532D"/>
    <circle cx="32.5" cy="33.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="36" cy="36.5" r="0.9" fill="#FFFFFF"/>

    <circle cx="66" cy="35" r="5" fill="#14532D"/>
    <circle cx="64.5" cy="33.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="68" cy="36.5" r="0.9" fill="#FFFFFF"/>
  </g>

  <!-- Frog Main Chubby Body -->
  <ellipse cx="50" cy="62" rx="31" ry="26" fill="url(#frog-body-grad)" filter="url(#frog-shadow)"/>

  <!-- Belly Patch -->
  <ellipse cx="50" cy="68" rx="20" ry="16" fill="url(#frog-belly-grad)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="27" cy="56" rx="6" ry="3.5" fill="#F43F5E" opacity="0.45"/>
  <ellipse cx="73" cy="56" rx="6" ry="3.5" fill="#F43F5E" opacity="0.45"/>

  <!-- Nostrils -->
  <circle cx="47" cy="49" r="0.8" fill="#166534"/>
  <circle cx="53" cy="49" r="0.8" fill="#166534"/>

  <!-- Cute Big Smile -->
  <path d="M 39 55 Q 50 64 61 55" fill="none" stroke="#14532D" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Open mouth tongue -->
  <path d="M 44 58.5 Q 50 66 56 58.5 Z" fill="#FB7185"/>

  <!-- Dangling Little Back Legs & Webbed Feet -->
  <g filter="url(#frog-shadow)">
    <!-- Left Leg -->
    <path d="M 26 76 C 22 84, 18 94, 22 101 C 24 104, 28 102, 29 97 C 32 91, 35 84, 34 78" fill="url(#frog-body-grad)"/>
    <circle cx="21" cy="101" r="2.2" fill="#4ADE80"/>
    <circle cx="25" cy="103" r="2.2" fill="#4ADE80"/>
    <circle cx="29" cy="101" r="2.2" fill="#4ADE80"/>

    <!-- Right Leg -->
    <path d="M 74 76 C 78 84, 82 94, 78 101 C 76 104, 72 102, 71 97 C 68 91, 65 84, 66 78" fill="url(#frog-body-grad)"/>
    <circle cx="79" cy="101" r="2.2" fill="#4ADE80"/>
    <circle cx="75" cy="103" r="2.2" fill="#4ADE80"/>
    <circle cx="71" cy="101" r="2.2" fill="#4ADE80"/>
  </g>

  <!-- Front Hands resting on tummy -->
  <g filter="url(#frog-shadow)">
    <ellipse cx="37" cy="73" rx="4.5" ry="3.5" fill="#86EFAC"/>
    <ellipse cx="63" cy="73" rx="4.5" ry="3.5" fill="#86EFAC"/>
  </g>
</svg>
